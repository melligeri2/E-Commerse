<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign-In</title>
<link rel="stylesheet" href="signin.css">

</head>

<body>

<section>
    <main>
        <div id="container">
           <h2>Sign-In</h2>
           <form id="loginform">
            <div>
                <input type="text" placeholder="Enter Username/email/phone number" id="loginUser">
            </div>
            <div>
                <input type="password" placeholder="Enter password" id="loginpwd">
            </div>
            <p id="usererr" class="err"></p>
            <button type="submit">Login</button>
           </form>
        </div>
    </main>

    <!-- Right side image -->
    <aside></aside>
</section>
<div class="checkout-modal">
    <div class="checkout-box">
        <h2>Order Summary</h2>
        <div class="bill-details"></div>
        <div class="qr-section">
            <canvas id="qr-code"></canvas>
        </div>
        <button class="close-checkout">Close</button>
    </div>
</div>
<script src="signin.js"></script>

</body>
</html>
